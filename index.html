<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sunshine App - Un diario para tus momentos felices">
  <meta name="theme-color" content="#DE0065">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sunshine">

  <title>Sunshine App</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/flower.svg">
  <link rel="apple-touch-icon" href="icons/flower.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #DE0065;
      --pink-light: #F6BCD6;
      --bg: #E7E7E7;
      --gray: #9D9D9D;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Schoolbell', cursive;
      background-color: var(--bg);
      color: var(--pink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ---------- Home screen ---------- */
    #homeScreen {
      justify-content: center;
      text-align: center;
      padding-left: 24px;
      padding-right: 24px;
    }

    .flower-container {
      animation: float 2.4s ease-in-out 2;
      will-change: transform;
    }

    .flower-container.lift {
      animation: none;
      transform: translateY(-38vh) scale(0.5);
      transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-22px); }
    }

    .flower-svg {
      width: min(58vw, 230px);
      height: auto;
      display: block;
    }

    .home-copy {
      transition: opacity 0.5s ease;
    }

    #homeScreen.leaving .home-copy {
      opacity: 0;
    }

    .welcome-text {
      font-size: clamp(32px, 9vw, 42px);
      line-height: 1.2;
      margin-top: 48px;
    }

    .tagline {
      position: absolute;
      bottom: calc(48px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: min(300px, 80vw);
      font-size: 13px;
      color: var(--gray);
      line-height: 1.5;
    }

    /* ---------- Main screen ---------- */
    #mainScreen {
      justify-content: space-between;
      padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .flower-top {
      flex-shrink: 0;
      padding-top: 8px;
    }

    .flower-small {
      width: min(34vw, 130px);
      height: auto;
      display: block;
    }

    .center-area {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .mode {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .mode.visible {
      display: flex;
    }

    /* Input mode */
    #inputMode {
      cursor: text;
    }

    .entry-text {
      font-size: clamp(20px, 5.5vw, 26px);
      line-height: 1.45;
      color: var(--pink);
      max-height: 40vh;
      overflow-y: auto;
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
    }

    .entry-text.empty {
      color: var(--gray);
    }

    .caret {
      display: none;
      width: 2px;
      height: 1em;
      background: var(--pink);
      vertical-align: text-bottom;
      margin-left: 1px;
    }

    #inputMode.focused .caret {
      display: inline-block;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .hidden-input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      border: 0;
      pointer-events: none;
    }

    /* Shuffle mode */
    .shuffle-title {
      font-size: clamp(20px, 5.5vw, 26px);
      margin-bottom: 28px;
    }

    .memory-display {
      font-size: clamp(18px, 4.8vw, 22px);
      line-height: 1.5;
      color: var(--pink);
      max-height: 34vh;
      overflow-y: auto;
      word-break: break-word;
      width: 100%;
    }

    .memory-display.empty {
      color: var(--gray);
    }

    /* ---------- Bottom controls ---------- */
    .bottom-area {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .action-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: min(50vw, 190px);
      height: 60px;
      border: 2px solid var(--pink);
      border-radius: 14px;
      background-color: var(--bg);
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .action-btn.visible {
      display: flex;
    }

    .action-btn:active {
      transform: scale(0.96);
      background-color: var(--pink-light);
    }

    .action-btn img {
      width: 30px;
      height: 30px;
      display: block;
    }

    .nav-chip {
      display: flex;
      gap: 6px;
      background-color: var(--pink-light);
      padding: 6px;
      border-radius: 12px;
    }

    .nav-btn {
      width: 58px;
      height: 46px;
      border: none;
      border-radius: 8px;
      background-color: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .nav-btn.active {
      background-color: var(--pink);
    }

    /* pink icon -> #E7E7E7 when its square is active */
    .nav-btn.active img {
      filter: brightness(0) invert(94%);
    }

    .nav-btn img {
      width: 26px;
      height: 26px;
      display: block;
    }

    /* Staggered reveal of the second screen */
    #mainScreen.active .flower-top,
    #mainScreen.active .center-area,
    #mainScreen.active .bottom-area {
      animation: rise 0.6s ease both;
    }

    #mainScreen.active .center-area { animation-delay: 0.12s; }
    #mainScreen.active .bottom-area { animation-delay: 0.24s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="homeScreen" class="screen active">
    <div class="flower-container" id="flowerContainer">
      <img src="icons/flower.svg" class="flower-svg" alt="">
    </div>
    <div class="home-copy">
      <div class="welcome-text">¿Qué te hizo feliz hoy?</div>
      <div class="tagline">Esta app fue hecha con amor para ayudarte a encontrar la luz en los días que se ven oscuros.</div>
    </div>
  </div>

  <div id="mainScreen" class="screen">
    <div class="flower-top">
      <img src="icons/flower.svg" class="flower-small" alt="">
    </div>

    <div class="center-area">
      <div id="inputMode" class="mode visible">
        <div class="entry-text empty" id="entryText"><span id="entryValue">¿Qué te hizo feliz hoy?</span><span class="caret"></span></div>
      </div>

      <div id="shuffleMode" class="mode">
        <div class="shuffle-title">Random memory</div>
        <div class="memory-display" id="memoryDisplay"></div>
      </div>
    </div>

    <div class="bottom-area">
      <button class="action-btn visible" id="saveBtn" aria-label="Guardar recuerdo">
        <img src="icons/plus.svg" alt="">
      </button>
      <button class="action-btn" id="shuffleActionBtn" aria-label="Otro recuerdo">
        <img src="icons/shuffle-action.svg" alt="">
      </button>

      <div class="nav-chip">
        <button class="nav-btn active" id="heartBtn" aria-label="Escribir">
          <img src="icons/heart.svg" alt="">
        </button>
        <button class="nav-btn" id="shuffleNavBtn" aria-label="Recuerdo al azar">
          <img src="icons/shuffle.svg" alt="">
        </button>
      </div>
    </div>

    <input class="hidden-input" id="memoryInput" type="text" autocomplete="off" autocapitalize="sentences">
  </div>

  <script>
    const PLACEHOLDER = '¿Qué te hizo feliz hoy?';
    const EMPTY_MESSAGE = 'Aún no hay recuerdos. ¡Escribe el primero!';

    const homeScreen = document.getElementById('homeScreen');
    const mainScreen = document.getElementById('mainScreen');
    const flowerContainer = document.getElementById('flowerContainer');
    const inputMode = document.getElementById('inputMode');
    const shuffleMode = document.getElementById('shuffleMode');
    const entryText = document.getElementById('entryText');
    const entryValue = document.getElementById('entryValue');
    const memoryInput = document.getElementById('memoryInput');
    const memoryDisplay = document.getElementById('memoryDisplay');
    const saveBtn = document.getElementById('saveBtn');
    const shuffleActionBtn = document.getElementById('shuffleActionBtn');
    const heartBtn = document.getElementById('heartBtn');
    const shuffleNavBtn = document.getElementById('shuffleNavBtn');

    let memories = [];

    function loadMemories() {
      try {
        memories = JSON.parse(localStorage.getItem('sunshineMemories')) || [];
      } catch {
        memories = [];
      }
    }

    function persist() {
      localStorage.setItem('sunshineMemories', JSON.stringify(memories));
    }

    function renderEntry() {
      const value = memoryInput.value;
      entryValue.textContent = value || PLACEHOLDER;
      entryText.classList.toggle('empty', value.length === 0);
    }

    function saveEntry() {
      const text = memoryInput.value.trim();
      if (!text) {
        memoryInput.focus();
        return;
      }
      memories.push({ text, date: new Date().toISOString() });
      persist();
      memoryInput.value = '';
      renderEntry();
      memoryInput.focus();
    }

    function showRandomMemory() {
      if (memories.length === 0) {
        memoryDisplay.textContent = EMPTY_MESSAGE;
        memoryDisplay.classList.add('empty');
        return;
      }
      memoryDisplay.classList.remove('empty');
      memoryDisplay.textContent = memories[Math.floor(Math.random() * memories.length)].text;
    }

    function switchMode(mode) {
      const writing = mode === 'input';

      inputMode.classList.toggle('visible', writing);
      shuffleMode.classList.toggle('visible', !writing);
      saveBtn.classList.toggle('visible', writing);
      shuffleActionBtn.classList.toggle('visible', !writing);
      heartBtn.classList.toggle('active', writing);
      shuffleNavBtn.classList.toggle('active', !writing);

      if (writing) {
        memoryInput.focus();
      } else {
        memoryInput.blur();
        showRandomMemory();
      }
    }

    function goToMain() {
      homeScreen.classList.add('leaving');
      flowerContainer.classList.add('lift');

      setTimeout(() => {
        homeScreen.classList.remove('active');
        mainScreen.classList.add('active');
      }, 700);
    }

    memoryInput.addEventListener('input', renderEntry);
    memoryInput.addEventListener('focus', () => inputMode.classList.add('focused'));
    memoryInput.addEventListener('blur', () => inputMode.classList.remove('focused'));
    memoryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveEntry();
    });

    document.querySelector('.center-area').addEventListener('click', () => {
      if (inputMode.classList.contains('visible')) memoryInput.focus();
    });
    saveBtn.addEventListener('click', saveEntry);
    shuffleActionBtn.addEventListener('click', showRandomMemory);
    heartBtn.addEventListener('click', () => switchMode('input'));
    shuffleNavBtn.addEventListener('click', () => switchMode('shuffle'));

    loadMemories();
    renderEntry();

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(goToMain, reducedMotion ? 600 : 4800);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
